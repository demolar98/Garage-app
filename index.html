<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<title>Гараж</title>
<style>
:root{
  --bg:#15171a; --bg2:#1c1f23; --line:#2b2f35; --text:#eceae4; --dim:#9a9d9a;
  --amber:#e08a2c; --amber-dim:#5a4326; --danger:#c85450; --mono:'SF Mono',Consolas,monospace;
  box-sizing:border-box;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f0ea; --bg2:#ffffff; --line:#ddd8cc; --text:#211f1a; --dim:#7a766c; --amber-dim:#f1dcb8;
  }
}
*{box-sizing:border-box; margin:0; padding:0;}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%;}
body{
  height:100%; min-height:100dvh; background:var(--bg2); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex; justify-content:center; overflow:hidden;
}
#shell{
  width:100%; max-width:480px; height:100%; min-height:100dvh; background:var(--bg);
  display:flex; flex-direction:column; overflow:hidden; position:relative;
}
@media (min-width:520px){
  #shell{ border-left:1px solid var(--line); border-right:1px solid var(--line); box-shadow:0 0 40px rgba(0,0,0,.35); }
}
header{
  padding:14px 18px 12px; border-bottom:1px solid var(--line); flex-shrink:0;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  display:flex; align-items:baseline; gap:8px;
}
header h1{font-size:17px; font-weight:700; letter-spacing:.2px;}
header .crumb{font-size:13px; color:var(--dim);}
main{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.screen{padding:14px 16px 24px; display:none;}
.screen.active{display:block;}
.card{
  background:var(--bg2); border:1px solid var(--line); border-radius:10px;
  padding:14px; margin-bottom:10px;
}
.list-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 4px; border-bottom:1px solid var(--line); cursor:pointer;
}
.list-row:last-child{border-bottom:none;}
.list-row .t{font-size:15px; font-weight:600;}
.list-row .s{font-size:12px; color:var(--dim); margin-top:2px;}
.list-row .arrow{color:var(--dim); font-size:16px;}
.empty{padding:40px 10px; text-align:center; color:var(--dim); font-size:14px; line-height:1.5;}
button{font-family:inherit; border:none; background:none; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
.btn{
  width:100%; padding:13px; border-radius:9px; font-size:15px; font-weight:600;
  background:var(--amber); color:#1a1410; margin-top:6px;
}
.btn.secondary{background:var(--bg2); color:var(--text); border:1px solid var(--line);}
.btn.danger{background:transparent; color:var(--danger); border:1px solid var(--danger);}
.fab{
  position:fixed; right:18px; bottom:calc(78px + env(safe-area-inset-bottom,0px));
  width:52px; height:52px; border-radius:50%; background:var(--amber); color:#1a1410;
  font-size:26px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,.35);
}
input,textarea,select{
  width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line);
  background:var(--bg); color:var(--text); font-size:16px; margin-bottom:10px; font-family:inherit;
}
label{font-size:12px; color:var(--dim); display:block; margin-bottom:5px; margin-top:2px;}
.row2{display:flex; gap:8px;}
.row2 > div{flex:1;}
.seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-bottom:10px;}
.seg button{flex:1; padding:9px 0; background:var(--bg); color:var(--dim); font-size:13px; font-weight:600;}
.seg button.on{background:var(--amber-dim); color:var(--amber);}
.entry{border-left:2px solid var(--amber); padding:10px 12px; margin-bottom:10px; background:var(--bg2); border-radius:0 8px 8px 0;}
.entry .top{display:flex; justify-content:space-between; font-size:13px; color:var(--dim); margin-bottom:4px;}
.entry .odo{font-family:var(--mono); color:var(--amber); font-weight:600;}
.entry .work{font-size:15px; font-weight:600; margin-bottom:6px;}
.entry .part{font-size:13px; color:var(--dim); display:flex; justify-content:space-between; padding:2px 0;}
.entry .part .art{font-family:var(--mono); color:var(--text);}
.entry .actions{display:flex; gap:16px; margin-top:8px;}
.entry .actions a{font-size:12px; color:var(--dim); text-decoration:underline;}
.partfield{border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; position:relative;}
.pf-wrap{position:relative;}
.pf-dropdown{position:absolute; left:0; right:0; top:100%; margin-top:2px; background:var(--bg2); border:1px solid var(--line); border-radius:8px; max-height:180px; overflow-y:auto; z-index:20; display:none;}
.pf-opt{padding:9px 12px; font-size:14px; border-bottom:1px solid var(--line); cursor:pointer;}
.pf-opt:last-child{border-bottom:none;}
.pf-opt:active{background:var(--amber-dim);}
.pf-opt .art{color:var(--dim); font-family:var(--mono); font-size:12px; margin-left:6px;}
.pf-addsuggest{display:none; color:var(--amber); font-size:13px; font-weight:600; padding:6px 2px 2px; cursor:pointer;}
.rm{position:absolute; top:6px; right:8px; color:var(--dim); font-size:18px; background:none;}
.addline{display:block; width:100%; background:transparent; font-size:13px; color:var(--amber); font-weight:600; padding:6px 0; text-align:left;}
nav{
  display:flex; flex-shrink:0; border-top:1px solid var(--line); background:var(--bg2);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav button{
  flex:1; padding:11px 0 9px; background:none; color:var(--dim); font-size:11px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
nav button .ic{font-size:20px;}
nav button.on{color:var(--amber);}
.searchbox{position:sticky; top:0; z-index:5; background:var(--bg); padding-top:2px;}
</style>
</head>
<body>
<div id="shell">
<header>
  <h1 id="hdrTitle">Гараж</h1>
  <span class="crumb" id="hdrCrumb"></span>
</header>

<main>

  <!-- CARS LIST -->
  <section class="screen active" id="s-cars">
    <div class="card" id="carsCard"></div>
    <button class="btn" onclick="showAddCar()">+ Добавить автомобиль</button>
  </section>

  <!-- CAR MENU -->
  <section class="screen" id="s-carMenu">
    <div class="card">
      <div class="list-row" onclick="go('history')"><div><div class="t">Просмотреть историю обслуживания</div></div><div class="arrow">›</div></div>
      <div class="list-row" onclick="go('addEntry')"><div><div class="t">Добавить данные</div></div><div class="arrow">›</div></div>
      <div class="list-row" onclick="go('editList')"><div><div class="t">Изменить данные</div></div><div class="arrow">›</div></div>
    </div>
    <button class="btn danger" onclick="deleteCar()">Удалить автомобиль</button>
  </section>

  <!-- HISTORY -->
  <section class="screen" id="s-history"></section>

  <!-- ADD/EDIT ENTRY -->
  <section class="screen" id="s-entryForm"></section>

  <!-- EDIT LIST -->
  <section class="screen" id="s-editList"></section>

  <!-- PARTS -->
  <section class="screen" id="s-parts">
    <div class="searchbox"><input id="partSearch" placeholder="Поиск по названию или артикулу" oninput="renderParts()"></div>
    <div class="card" id="partsCard"></div>
    <button class="btn" onclick="showAddPart()">+ Добавить запчасть</button>
  </section>

  <section class="screen" id="s-addPart"></section>
  <section class="screen" id="s-addCar"></section>

</main>

<nav>
  <button id="navCars" class="on" onclick="switchTab('cars')"><span class="ic">🚗</span>Автомобили</button>
  <button id="navParts" onclick="switchTab('parts')"><span class="ic">🔧</span>Запчасти</button>
</nav>
</div>

<script>
'use strict';

/* ---------- Telegram / storage ---------- */
const tg = () => window.Telegram?.WebApp || null;
try {
  const app = tg();
  if (app) {
    app.ready();
    app.expand();
  }
} catch (e) {
  console.warn('Telegram WebApp init failed:', e);
}

function cloudStorage(){ return tg()?.CloudStorage || null; }
function tgReady(){ return !!cloudStorage(); }
function delay(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

let cloudWorks = false;
let storageWarningShown = false;
const CHUNK = 3800;
const persistQueues = new Map();

function csSetItem(key, value){
  return new Promise(resolve => {
    const cs = cloudStorage();
    if (!cs) return resolve(false);
    try {
      cs.setItem(key, value, (err, isStored) => resolve(!err && isStored !== false));
    } catch (e) {
      resolve(false);
    }
  });
}

async function csSetItemRetry(key, value, tries = 3){
  for (let i = 0; i < tries; i++) {
    if (await csSetItem(key, value)) return true;
    await delay(200 * (i + 1));
  }
  return false;
}

function csGetItem(key){
  return new Promise(resolve => {
    const cs = cloudStorage();
    if (!cs) return resolve('');
    try {
      cs.getItem(key, (err, value) => resolve(err ? '' : String(value ?? '')));
    } catch (e) {
      resolve('');
    }
  });
}

function csGetItems(keys){
  return new Promise(resolve => {
    if (!keys.length) return resolve({});
    const cs = cloudStorage();
    if (!cs) return resolve({});
    try {
      cs.getItems(keys, (err, values) => {
        const source = !err && values && typeof values === 'object' ? values : {};
        const result = {};
        keys.forEach(key => { result[key] = String(source[key] ?? ''); });
        resolve(result);
      });
    } catch (e) {
      resolve({});
    }
  });
}

function csRemoveItems(keys){
  return new Promise(resolve => {
    if (!keys.length) return resolve(true);
    const cs = cloudStorage();
    if (!cs) return resolve(false);
    try {
      cs.removeItems(keys, (err, removed) => resolve(!err && removed !== false));
    } catch (e) {
      resolve(false);
    }
  });
}

async function probeCloud(){
  if (!tgReady()) return false;
  const key = '__probe';
  const token = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
  try {
    if (!(await csSetItemRetry(key, token))) return false;
    const readBack = await csGetItem(key);
    await csRemoveItems([key]);
    return readBack === token;
  } catch (e) {
    return false;
  }
}

const localStore = {
  get(key, fallback){
    try {
      const raw = localStorage.getItem(key);
      return raw == null ? fallback : (JSON.parse(raw) ?? fallback);
    } catch (e) {
      return fallback;
    }
  },
  set(key, value){
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      return false;
    }
  }
};

function cloneData(value){
  if (typeof structuredClone === 'function') {
    try { return structuredClone(value); } catch (e) {}
  }
  return JSON.parse(JSON.stringify(value));
}

function makeCloudVersion(){
  return `v${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
}

function parseCloudMeta(raw){
  if (!raw) return null;
  try {
    const meta = JSON.parse(raw);
    if (!meta || typeof meta.version !== 'string' || !Number.isInteger(meta.n) || meta.n < 1) return null;
    return meta;
  } catch (e) {
    return null;
  }
}

async function readChunked(keys){
  const values = await csGetItems(keys);
  if (keys.some(key => values[key] === '')) return { ok:false, data:null };
  try {
    return { ok:true, data:JSON.parse(keys.map(key => values[key]).join('')) };
  } catch (e) {
    return { ok:false, data:null };
  }
}

async function loadCloud(name){
  const meta = parseCloudMeta(await csGetItem(`${name}_meta`));
  if (meta) {
    const keys = Array.from({length: meta.n}, (_, i) => `${name}_${meta.version}_${i}`);
    const result = await readChunked(keys);
    if (result.ok) return result;
  }

  // Backward compatibility with the original storage format.
  const legacyN = Number.parseInt(await csGetItem(`${name}_n`), 10) || 0;
  if (legacyN > 0) {
    const keys = Array.from({length: legacyN}, (_, i) => `${name}_${i}`);
    const result = await readChunked(keys);
    if (result.ok) return result;
  }

  return { ok:false, data:null };
}

async function persistCloud(name, dataObj){
  const str = JSON.stringify(dataObj);
  const chunks = [];
  for (let i = 0; i < str.length; i += CHUNK) chunks.push(str.slice(i, i + CHUNK));
  if (!chunks.length) chunks.push('null');

  const previousMeta = parseCloudMeta(await csGetItem(`${name}_meta`));
  const version = makeCloudVersion();
  const keys = chunks.map((_, i) => `${name}_${version}_${i}`);

  for (let i = 0; i < chunks.length; i++) {
    if (!(await csSetItemRetry(keys[i], chunks[i]))) return false;
  }

  const meta = JSON.stringify({ version, n: chunks.length, savedAt: Date.now() });
  if (!(await csSetItemRetry(`${name}_meta`, meta))) return false;

  // Only after the new manifest is committed do we remove old chunks.
  if (previousMeta) {
    const oldKeys = Array.from({length: previousMeta.n}, (_, i) => `${name}_${previousMeta.version}_${i}`);
    await csRemoveItems(oldKeys);
  }

  // Remove legacy keys after successful migration.
  const legacyN = Number.parseInt(await csGetItem(`${name}_n`), 10) || 0;
  if (legacyN > 0) {
    const legacyKeys = Array.from({length: legacyN}, (_, i) => `${name}_${i}`);
    legacyKeys.push(`${name}_n`);
    await csRemoveItems(legacyKeys);
  }

  return true;
}

function persist(name, dataObj){
  const snapshot = cloneData(dataObj);
  const localSaved = localStore.set(name, snapshot);
  if (!localSaved && !cloudWorks) {
    showStorageWarning('⚠️ Не удалось сохранить данные ни в облако, ни локально. Не закрывайте приложение и попробуйте снова.');
  }
  if (!cloudWorks) return Promise.resolve(localSaved);

  const previous = persistQueues.get(name) || Promise.resolve();
  const next = previous
    .catch(() => {})
    .then(async () => {
      const ok = await persistCloud(name, snapshot);
      if (!ok) showStorageWarning('⚠️ Облачная синхронизация временно недоступна. Локальная копия данных сохранена на этом устройстве.');
      return ok;
    });

  persistQueues.set(name, next);
  return next;
}

async function load(name, fallback){
  if (cloudWorks) {
    const cloud = await loadCloud(name);
    if (cloud.ok) {
      localStore.set(name, cloud.data);
      return cloud.data;
    }
  }
  return localStore.get(name, fallback);
}

/* ---------- state ---------- */
let cars = [];
let parts = [];
let curCarId = null;
let curTab = 'cars';
let curEntryId = null;
let entryFormBaseline = null;

function saveCars(){ return persist('cars', cars); }
function saveParts(){ return persist('parts', parts); }

function uid(){
  if (window.crypto?.randomUUID) return window.crypto.randomUUID();
  return `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 10)}`;
}

function text(value){ return String(value ?? ''); }
function safeId(value){
  const id = text(value);
  return /^[A-Za-z0-9_-]+$/.test(id) ? id : uid();
}
function cleanNumber(value){
  const n = Number(value);
  return Number.isFinite(n) && n >= 0 ? n : 0;
}

function normalizeCars(value){
  if (!Array.isArray(value)) return [];
  return value
    .filter(car => car && typeof car === 'object')
    .map(car => ({
      id: safeId(car.id),
      name: text(car.name).trim() || 'Без названия',
      entries: Array.isArray(car.entries) ? car.entries
        .filter(e => e && typeof e === 'object')
        .map(e => ({
          id: safeId(e.id),
          date: text(e.date),
          km: cleanNumber(e.km),
          mh: cleanNumber(e.mh),
          work: text(e.work),
          items: Array.isArray(e.items) ? e.items
            .filter(it => it && typeof it === 'object')
            .map(it => ({ name:text(it.name), article:text(it.article) }))
            .filter(it => it.name.trim()) : []
        })) : []
    }));
}

function normalizeParts(value){
  if (!Array.isArray(value)) return [];
  return value
    .filter(p => p && typeof p === 'object' && text(p.name).trim())
    .map(p => ({ id:safeId(p.id), name:text(p.name).trim(), article:text(p.article).trim() }));
}

/* ---------- navigation ---------- */
function showScreen(id){
  const target = document.getElementById(id);
  if (!target) return;
  document.querySelectorAll('.screen').forEach(screen => screen.classList.remove('active'));
  target.classList.add('active');
  const main = document.querySelector('main');
  if (main) main.scrollTop = 0;
}

function setHeader(title, crumb = ''){
  document.getElementById('hdrTitle').textContent = title;
  document.getElementById('hdrCrumb').textContent = crumb;
}

function switchTab(tab){
  guardLeaveEntryForm(() => doSwitchTab(tab));
}

function doSwitchTab(tab){
  curTab = tab;
  document.getElementById('navCars').classList.toggle('on', tab === 'cars');
  document.getElementById('navParts').classList.toggle('on', tab === 'parts');
  if (tab === 'cars') {
    renderCars();
    showScreen('s-cars');
    setHeader('Гараж');
  } else {
    renderParts();
    showScreen('s-parts');
    setHeader('Запчасти');
  }
}

function readEntryFormState(){
  const dateEl = document.getElementById('f-date');
  if (!dateEl) return null;
  return {
    date: dateEl.value,
    km: document.getElementById('f-km')?.value ?? '',
    mh: document.getElementById('f-mh')?.value ?? '',
    work: document.getElementById('f-work')?.value.trim() ?? '',
    items: [...document.querySelectorAll('#partsFields .partfield')].map(field => ({
      name: field.querySelector('.pf-name')?.value.trim() ?? '',
      article: field.querySelector('.pf-art')?.value.trim() ?? ''
    }))
  };
}

function serializeEntryForm(){
  const state = readEntryFormState();
  return state ? JSON.stringify(state) : null;
}

function isEntryFormDirty(){
  const screen = document.getElementById('s-entryForm');
  if (!screen.classList.contains('active') || entryFormBaseline == null) return false;
  return serializeEntryForm() !== entryFormBaseline;
}

function guardLeaveEntryForm(afterFn){
  if (!isEntryFormDirty()) {
    afterFn();
    return;
  }

  const wantsSave = confirm('Вы не сохранили изменения.\n\nОК — сохранить и выйти\nОтмена — выйти без сохранения');
  if (wantsSave) {
    const ok = saveEntry(true);
    if (!ok) {
      const discard = confirm('Чтобы сохранить, нужно указать дату и вид работы.\nВыйти без сохранения?');
      if (!discard) return;
    }
  }

  entryFormBaseline = null;
  afterFn();
}

/* ---------- cars ---------- */
function renderCars(){
  const card = document.getElementById('carsCard');
  if (!cars.length) {
    card.innerHTML = '<div class="empty">Пока нет ни одного автомобиля.<br>Добавьте первый, чтобы вести историю обслуживания.</div>';
    return;
  }

  card.innerHTML = cars.map(car => {
    const latest = latestEntry(car);
    const sub = latest ? `${esc(latest.date)} · ${odoLabel(latest)}` : 'Нет записей';
    return `<div class="list-row" onclick="openCar('${car.id}')">
      <div><div class="t">${esc(car.name)}</div><div class="s">${sub}</div></div>
      <div class="arrow">›</div></div>`;
  }).join('');
}

function showAddCar(){
  document.getElementById('s-addCar').innerHTML = `
    <label>Название автомобиля</label>
    <input id="newCarName" placeholder="Например: Хонда СБР 600" autocomplete="off">
    <button class="btn" onclick="addCar()">Сохранить</button>
    <button class="btn secondary" onclick="doSwitchTab('cars')">Отмена</button>`;
  showScreen('s-addCar');
  setHeader('Новый автомобиль');
  setTimeout(() => document.getElementById('newCarName')?.focus(), 0);
}

function addCar(){
  const input = document.getElementById('newCarName');
  const name = input?.value.trim() || '';
  if (!name) {
    input?.focus();
    return;
  }
  cars.push({ id:uid(), name, entries:[] });
  saveCars();
  doSwitchTab('cars');
}

function openCar(id){
  const car = cars.find(item => item.id === id);
  if (!car) {
    doSwitchTab('cars');
    return;
  }
  curCarId = id;
  showScreen('s-carMenu');
  setHeader(car.name, 'Автомобиль');
}

function deleteCar(){
  const car = currentCar();
  if (!car) return doSwitchTab('cars');
  if (!confirm(`Удалить «${car.name}» и всю его историю?`)) return;
  cars = cars.filter(item => item.id !== curCarId);
  curCarId = null;
  saveCars();
  doSwitchTab('cars');
}

function currentCar(){ return cars.find(car => car.id === curCarId) || null; }

function go(where){
  if (where === 'history') renderHistory();
  else if (where === 'addEntry') showEntryForm(null);
  else if (where === 'editList') renderEditList();
}

function backToCar(){
  const car = currentCar();
  if (!car) return doSwitchTab('cars');
  showScreen('s-carMenu');
  setHeader(car.name, 'Автомобиль');
}

/* ---------- history ---------- */
function entryDateValue(entry){
  const iso = toInputDate(entry?.date || '');
  const time = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? Date.parse(`${iso}T00:00:00`) : NaN;
  return Number.isFinite(time) ? time : 0;
}

function sortEntries(entries){
  return [...entries].sort((a, b) =>
    entryDateValue(b) - entryDateValue(a) ||
    cleanNumber(b.km) - cleanNumber(a.km) ||
    cleanNumber(b.mh) - cleanNumber(a.mh)
  );
}

function renderHistory(){
  const car = currentCar();
  if (!car) return doSwitchTab('cars');

  const box = document.getElementById('s-history');
  const sorted = sortEntries(car.entries);
  box.innerHTML = sorted.length
    ? sorted.map(entry => `
        <div class="entry">
          <div class="top"><span>${esc(entry.date)}</span><span class="odo">${odoLabel(entry)}</span></div>
          <div class="work">${esc(entry.work)}</div>
          ${(entry.items || []).map(item => `<div class="part"><span>${esc(item.name)}</span><span class="art">${esc(item.article || '')}</span></div>`).join('')}
        </div>`).join('')
    : '<div class="empty">Записей пока нет.</div>';

  box.innerHTML += '<button class="btn secondary" onclick="backToCar()">‹ К автомобилю</button>';
  showScreen('s-history');
  setHeader(car.name, 'История');
}

/* ---------- edit list ---------- */
function renderEditList(){
  const car = currentCar();
  if (!car) return doSwitchTab('cars');

  const box = document.getElementById('s-editList');
  const sorted = sortEntries(car.entries);
  box.innerHTML = sorted.length
    ? '<div class="card">' + sorted.map(entry => `
        <div class="list-row" onclick="showEntryForm('${entry.id}')">
          <div><div class="t">${esc(entry.date)} — ${esc(entry.work)}</div><div class="s">${odoLabel(entry)}</div></div>
          <div class="arrow">›</div></div>`).join('') + '</div>'
    : '<div class="empty">Нет записей для изменения.</div>';

  box.innerHTML += '<button class="btn secondary" onclick="backToCar()">‹ К автомобилю</button>';
  showScreen('s-editList');
  setHeader(car.name, 'Изменить данные');
}

/* ---------- entry form ---------- */
function showEntryForm(entryId){
  const car = currentCar();
  if (!car) return doSwitchTab('cars');

  curEntryId = entryId || null;
  const entry = entryId ? car.entries.find(item => item.id === entryId) : null;
  if (entryId && !entry) return renderEditList();

  const data = entry || { date:'', km:'', mh:'', work:'', items:[{name:'', article:''}] };
  const box = document.getElementById('s-entryForm');
  box.innerHTML = `
    <label>Дата</label>
    <input type="date" id="f-date" value="${escAttr(toInputDate(data.date))}">
    <div class="row2">
      <div><label>Пробег, км</label><input id="f-km" type="number" min="0" step="any" inputmode="decimal" placeholder="—" value="${data.km || ''}"></div>
      <div><label>Мото-часы</label><input id="f-mh" type="number" min="0" step="any" inputmode="decimal" placeholder="—" value="${data.mh || ''}"></div>
    </div>
    <label>Вид работы</label>
    <input id="f-work" placeholder="Например: Замена фильтров и масла" value="${escAttr(data.work)}">
    <label>Запчасти</label>
    <div id="partsFields"></div>
    <button type="button" class="addline" onclick="addPartField()">+ ещё запчасть</button>
    <button class="btn" onclick="saveEntry()">Сохранить запись</button>
    ${entryId ? '<button class="btn danger" onclick="deleteEntry()">Удалить запись</button>' : ''}
    <button class="btn secondary" onclick="cancelEntryForm()">Отмена</button>`;

  const items = data.items?.length ? data.items : [{name:'', article:''}];
  items.forEach(item => addPartField(item.name, item.article));

  showScreen('s-entryForm');
  setHeader(car.name, entryId ? 'Изменить запись' : 'Новая запись');
  entryFormBaseline = serializeEntryForm();
}

function addPartField(name = '', article = ''){
  const container = document.getElementById('partsFields');
  if (!container) return;

  const wrap = document.createElement('div');
  wrap.className = 'partfield';
  wrap.innerHTML = `
    <button type="button" class="rm" aria-label="Удалить строку запчасти" onclick="this.parentElement.remove()">×</button>
    <label>Название</label>
    <div class="pf-wrap">
      <input class="pf-name" value="${escAttr(name)}" placeholder="Название запчасти/расходника" autocomplete="off">
      <div class="pf-dropdown"></div>
    </div>
    <label>Артикул</label><input class="pf-art" value="${escAttr(article)}" placeholder="Артикул" autocomplete="off">
    <div class="pf-addsuggest"></div>`;
  container.appendChild(wrap);

  const nameInput = wrap.querySelector('.pf-name');
  const artInput = wrap.querySelector('.pf-art');
  const dropdown = wrap.querySelector('.pf-dropdown');
  const addBox = wrap.querySelector('.pf-addsuggest');

  function refresh(){
    const query = nameInput.value.trim().toLowerCase();
    if (!query) {
      dropdown.style.display = 'none';
      dropdown.innerHTML = '';
      addBox.style.display = 'none';
      addBox.textContent = '';
      return;
    }

    const matches = parts.filter(part =>
      part.name.toLowerCase().includes(query) || (part.article || '').toLowerCase().includes(query)
    );

    if (matches.length) {
      dropdown.innerHTML = matches.slice(0, 6).map(part =>
        `<div class="pf-opt" data-id="${part.id}">${esc(part.name)}${part.article ? ` <span class="art">${esc(part.article)}</span>` : ''}</div>`
      ).join('');
      dropdown.style.display = 'block';
    } else {
      dropdown.style.display = 'none';
      dropdown.innerHTML = '';
    }

    refreshAddBox();
  }

  function refreshAddBox(){
    const nameValue = nameInput.value.trim();
    const articleValue = artInput.value.trim();
    const exact = parts.some(part =>
      part.name.trim().toLowerCase() === nameValue.toLowerCase() &&
      (part.article || '').trim().toLowerCase() === articleValue.toLowerCase()
    );

    if (nameValue && articleValue && !exact) {
      addBox.textContent = `+ добавить «${nameValue}» в каталог запчастей`;
      addBox.style.display = 'block';
    } else {
      addBox.style.display = 'none';
      addBox.textContent = '';
    }
  }

  nameInput.addEventListener('input', refresh);
  nameInput.addEventListener('focus', refresh);
  nameInput.addEventListener('blur', () => setTimeout(() => { dropdown.style.display = 'none'; }, 150));
  artInput.addEventListener('input', refreshAddBox);

  dropdown.addEventListener('click', event => {
    const option = event.target.closest('.pf-opt');
    if (!option) return;
    const part = parts.find(item => item.id === option.dataset.id);
    if (!part) return;
    nameInput.value = part.name;
    artInput.value = part.article || '';
    dropdown.style.display = 'none';
    dropdown.innerHTML = '';
    addBox.style.display = 'none';
    addBox.textContent = '';
  });

  addBox.addEventListener('click', () => {
    const partName = nameInput.value.trim();
    const partArticle = artInput.value.trim();
    if (!partName || !partArticle) return;

    const duplicate = parts.some(part =>
      part.name.toLowerCase() === partName.toLowerCase() &&
      (part.article || '').toLowerCase() === partArticle.toLowerCase()
    );
    if (!duplicate) {
      parts.push({ id:uid(), name:partName, article:partArticle });
      saveParts();
    }

    addBox.textContent = duplicate ? '✓ уже есть в каталоге' : '✓ добавлено в каталог запчастей';
    setTimeout(() => {
      addBox.style.display = 'none';
      addBox.textContent = '';
    }, 1200);
  });
}

function readNonNegativeNumber(id, label){
  const input = document.getElementById(id);
  const raw = input?.value.trim() || '';
  if (!raw) return 0;
  const value = Number(raw);
  if (!Number.isFinite(value) || value < 0) {
    alert(`${label} должен быть неотрицательным числом`);
    input?.focus();
    return null;
  }
  return value;
}

function saveEntry(skipNav = false){
  const car = currentCar();
  if (!car) return false;

  const date = document.getElementById('f-date')?.value || '';
  const km = readNonNegativeNumber('f-km', 'Пробег');
  if (km == null) return false;
  const mh = readNonNegativeNumber('f-mh', 'Мото-часы');
  if (mh == null) return false;
  const work = document.getElementById('f-work')?.value.trim() || '';

  if (!date || !work) {
    alert('Укажите дату и вид работы');
    return false;
  }

  const items = [...document.querySelectorAll('#partsFields .partfield')]
    .map(field => ({
      name: field.querySelector('.pf-name')?.value.trim() || '',
      article: field.querySelector('.pf-art')?.value.trim() || ''
    }))
    .filter(item => item.name);

  const data = {
    id: curEntryId || uid(),
    date: fromInputDate(date),
    km,
    mh,
    work,
    items
  };

  if (curEntryId) {
    const index = car.entries.findIndex(entry => entry.id === curEntryId);
    if (index < 0) {
      alert('Не удалось найти запись для изменения');
      return false;
    }
    car.entries[index] = data;
  } else {
    car.entries.push(data);
    curEntryId = data.id;
  }

  saveCars();
  entryFormBaseline = serializeEntryForm();

  if (!skipNav) {
    entryFormBaseline = null;
    backToCar();
  }
  return true;
}

function deleteEntry(){
  const car = currentCar();
  if (!car || !curEntryId) return;
  if (!confirm('Удалить эту запись?')) return;
  car.entries = car.entries.filter(entry => entry.id !== curEntryId);
  curEntryId = null;
  entryFormBaseline = null;
  saveCars();
  renderEditList();
}

function cancelEntryForm(){
  entryFormBaseline = null;
  curEntryId = null;
  backToCar();
}

/* ---------- parts catalog ---------- */
function renderParts(){
  const search = document.getElementById('partSearch');
  const query = (search?.value || '').trim().toLowerCase();
  const filtered = parts.filter(part =>
    part.name.toLowerCase().includes(query) || (part.article || '').toLowerCase().includes(query)
  );

  const card = document.getElementById('partsCard');
  if (!parts.length) {
    card.innerHTML = '<div class="empty">Каталог пуст. Добавьте первую запчасть.</div>';
    return;
  }
  if (!filtered.length) {
    card.innerHTML = '<div class="empty">Ничего не найдено.</div>';
    return;
  }

  card.innerHTML = filtered.map(part => `
    <div class="list-row" onclick="editPart('${part.id}')">
      <div><div class="t">${esc(part.name)}</div><div class="s">${esc(part.article || '—')}</div></div>
      <div class="arrow">›</div></div>`).join('');
}

function showAddPart(id = null){
  const part = id ? parts.find(item => item.id === id) : null;
  if (id && !part) return doSwitchTab('parts');

  window.__editPartId = id || null;
  const data = part || { name:'', article:'' };
  document.getElementById('s-addPart').innerHTML = `
    <label>Название</label><input id="p-name" value="${escAttr(data.name)}" placeholder="Название запчасти" autocomplete="off">
    <label>Артикул</label><input id="p-art" value="${escAttr(data.article)}" placeholder="Артикул" autocomplete="off">
    <button class="btn" onclick="savePart()">Сохранить</button>
    ${id ? '<button class="btn danger" onclick="delPart()">Удалить</button>' : ''}
    <button class="btn secondary" onclick="doSwitchTab('parts')">Отмена</button>`;
  showScreen('s-addPart');
  setHeader(id ? 'Изменить запчасть' : 'Новая запчасть');
}

function editPart(id){ showAddPart(id); }

function savePart(){
  const nameInput = document.getElementById('p-name');
  const name = nameInput?.value.trim() || '';
  const article = document.getElementById('p-art')?.value.trim() || '';

  if (!name) {
    nameInput?.focus();
    return;
  }
  if (!article && !confirm('Вы забыли внести артикул. Сохранить без артикула?')) return;

  const editId = window.__editPartId || null;
  const duplicate = parts.some(part =>
    part.id !== editId &&
    part.name.toLowerCase() === name.toLowerCase() &&
    (part.article || '').toLowerCase() === article.toLowerCase()
  );
  if (duplicate) {
    alert('Такая запчасть уже есть в каталоге');
    return;
  }

  if (editId) {
    const part = parts.find(item => item.id === editId);
    if (!part) return doSwitchTab('parts');
    part.name = name;
    part.article = article;
  } else {
    parts.push({ id:uid(), name, article });
  }

  saveParts();
  doSwitchTab('parts');
}

function delPart(){
  const id = window.__editPartId || null;
  if (!id) return;
  if (!confirm('Удалить запчасть из каталога?')) return;
  parts = parts.filter(part => part.id !== id);
  window.__editPartId = null;
  saveParts();
  doSwitchTab('parts');
}

/* ---------- helpers ---------- */
function odoLabel(entry){
  const labels = [];
  if (cleanNumber(entry?.km)) labels.push(`${cleanNumber(entry.km)} км`);
  if (cleanNumber(entry?.mh)) labels.push(`${cleanNumber(entry.mh)} м.ч.`);
  return labels.length ? labels.join(' · ') : '—';
}

function latestEntry(car){
  if (!car?.entries?.length) return null;
  return sortEntries(car.entries)[0] || null;
}

function esc(value){
  return text(value).replace(/[&<>"']/g, char => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[char]));
}

function escAttr(value){ return esc(value); }

function toInputDate(value){
  const date = text(value);
  if (!date) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(date)) return date;
  const match = date.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  return match ? `${match[3]}-${match[2]}-${match[1]}` : '';
}

function fromInputDate(value){
  const match = text(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return match ? `${match[3]}.${match[2]}.${match[1]}` : '';
}

function showStorageWarning(message = '⚠️ Облачная синхронизация недоступна — данные сохраняются только на этом устройстве/клиенте.'){
  if (storageWarningShown) return;
  storageWarningShown = true;
  const banner = document.createElement('div');
  banner.id = 'storageWarning';
  banner.style.cssText = 'background:#5a4326;color:#e08a2c;font-size:12px;line-height:1.4;padding:8px 14px;text-align:center;';
  banner.textContent = message;
  const shell = document.getElementById('shell');
  shell.insertBefore(banner, shell.querySelector('header').nextSibling);
}

/* ---------- init ---------- */
(async function init(){
  cloudWorks = await probeCloud();
  if (!cloudWorks) showStorageWarning();

  const [loadedCars, loadedParts] = await Promise.all([
    load('cars', []),
    load('parts', [])
  ]);

  cars = normalizeCars(loadedCars);
  parts = normalizeParts(loadedParts);
  renderCars();
})();
</script>
