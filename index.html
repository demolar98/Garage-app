<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<title>Гараж</title>
<style>
:root{
  --bg:#15171a; --bg2:#1c1f23; --line:#2b2f35; --text:#eceae4; --dim:#9a9d9a;
  --amber:#e08a2c; --amber-dim:#5a4326; --danger:#c85450; --mono:'SF Mono',Consolas,monospace;
  box-sizing:border-box;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f0ea; --bg2:#ffffff; --line:#ddd8cc; --text:#211f1a; --dim:#7a766c; --amber-dim:#f1dcb8;
  }
}
*{box-sizing:border-box; margin:0; padding:0; touch-action:manipulation;}
html{
  height:100%;
  scroll-padding-top:env(safe-area-inset-top,0px);
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  height:100%; min-height:100dvh; background:var(--bg2); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex; justify-content:center; overflow:hidden;
  touch-action:pan-y;
  -webkit-touch-callout:none;
}
#shell{
  width:100%; max-width:480px; height:100%; min-height:100dvh; background:var(--bg);
  display:flex; flex-direction:column; overflow:hidden; position:relative;
}
@media (min-width:520px){
  #shell{ border-left:1px solid var(--line); border-right:1px solid var(--line); box-shadow:0 0 40px rgba(0,0,0,.35); }
}
header{
  padding:14px 18px 12px; border-bottom:1px solid var(--line); flex-shrink:0;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  display:flex; align-items:baseline; gap:8px;
}
header h1{font-size:17px; font-weight:700; letter-spacing:.2px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
header .crumb{font-size:13px; color:var(--dim);}
.header-sort{
  width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  color:var(--dim); font-size:15px; background:transparent; align-self:center; flex-shrink:0;
  transition:opacity .15s;
}
.header-sort:active{color:var(--amber);}
.header-sort.hidden{display:none;}
main{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.screen{padding:14px 16px 24px; display:none;}
.screen.active{display:block;}
#s-renameCar.active{display:flex; flex-direction:column; min-height:100%;}
.screen.has-fab{padding-bottom:96px;}
.card{
  background:var(--bg2); border:1px solid var(--line); border-radius:10px;
  padding:14px; margin-bottom:10px;
}
.list-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 4px; border-bottom:1px solid var(--line); cursor:pointer;
}
.list-row:last-child{border-bottom:none;}
.list-row .t{font-size:15px; font-weight:600;}
.list-row .s{font-size:12px; color:var(--dim); margin-top:2px;}
.list-row .arrow{color:var(--dim); font-size:16px;}
.list-row .main{flex:1; min-width:0;}
.list-row .main .t,
.list-row .main .s{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.list-row .row-actions{display:flex; align-items:center; gap:4px; flex-shrink:0;}
.icon-btn{
  width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  color:var(--dim); font-size:16px; background:transparent; opacity:.6;
  transition:opacity .15s, color .15s;
}
.icon-btn:active{background:transparent; color:var(--amber); opacity:1;}
.empty{padding:40px 10px; text-align:center; color:var(--dim); font-size:14px; line-height:1.5;}
.storage-status{padding:10px 4px 2px; text-align:center; font-size:12px; color:var(--dim); line-height:1.5;}
.storage-status.warn{color:var(--amber);}
.storage-status.danger{color:var(--danger);}
.list-row .s.warn{color:var(--amber);}
.list-row .s.danger{color:var(--danger);}
.maint-badge{font-size:12px; font-weight:600; color:var(--dim); flex-shrink:0; padding-left:8px; text-align:right; white-space:nowrap;}
.maint-badge.warn{color:var(--amber);}
.maint-badge.danger{color:var(--danger);}
button{font-family:inherit; border:none; background:none; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
.btn{
  width:100%; padding:13px; border-radius:9px; font-size:15px; font-weight:600;
  background:var(--amber); color:#1a1410; margin-top:6px;
}
.btn.secondary{background:var(--bg2); color:var(--text); border:1px solid var(--line);}
.btn.danger{background:transparent; color:var(--danger); border:1px solid var(--danger);}
.back-fab{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(70px + env(safe-area-inset-bottom,0px));
  width:calc(100% - 32px);
  max-width:448px;
  z-index:10;
  margin:0;
  display:flex;
  gap:8px;
}
.back-fab .btn{margin-top:0;}
.back-fab.hidden{display:none;}
.entry-fab{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(70px + env(safe-area-inset-bottom,0px));
  width:calc(100% - 32px);
  max-width:448px;
  z-index:10;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.entry-fab.hidden{display:none;}
.entry-fab .btn{margin-top:0;}
.entry-fab-row{display:flex; gap:8px;}
.entry-fab-row .btn{margin-top:0;}
.delete-fab{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(62px + env(safe-area-inset-bottom,0px));
  width:calc(100% - 32px);
  max-width:448px;
  z-index:10;
}
.delete-fab.hidden{display:none;}
.delete-fab .btn{margin-top:0;}
#s-entryForm{padding-bottom:190px;}
input,textarea,select{
  width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line);
  background:var(--bg); color:var(--text); font-size:16px; margin-bottom:10px; font-family:inherit;
}
input,textarea{ -webkit-appearance:none; appearance:none; }
textarea{
  resize:none;
  line-height:1.45;
  min-height:44px;
  overflow:hidden;
}
label{font-size:12px; color:var(--dim); display:block; margin-bottom:5px; margin-top:2px;}
.row2{display:flex; gap:8px;}
.row2 > div{flex:1;}
.seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-bottom:10px;}
.seg button{flex:1; padding:9px 0; background:var(--bg); color:var(--dim); font-size:13px; font-weight:600;}
.seg button.on{background:var(--amber-dim); color:var(--amber);}
.entry{border-left:2px solid var(--amber); padding:10px 12px; margin-bottom:10px; background:var(--bg2); border-radius:0 8px 8px 0;}
.entry .top{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--dim); margin-bottom:4px; gap:8px;}
.entry .top .odo{font-family:var(--mono); color:var(--amber); font-weight:600; flex:1; text-align:right;}
.entry .top .edit-btn{
  width:30px; height:30px; border-radius:7px; display:flex; align-items:center; justify-content:center;
  color:var(--dim); font-size:15px; flex-shrink:0; background:transparent; opacity:.6;
  transition:opacity .15s, color .15s;
}
.entry .top .edit-btn:active{background:transparent; color:var(--amber); opacity:1;}
.entry .work{font-size:15px; font-weight:600; margin-bottom:6px; white-space:pre-wrap; word-break:break-word;}
.entry .note{font-size:13px; color:var(--dim); font-style:italic; margin-top:6px; white-space:pre-wrap; word-break:break-word;}
.entry .part{font-size:13px; color:var(--dim); display:flex; justify-content:space-between; padding:2px 0; gap:8px;}
.entry .part .art{font-family:var(--mono); color:var(--text); text-align:right;}
.partfield{border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; position:relative;}
.pf-wrap{position:relative;}
.pf-dropdown{position:absolute; left:0; right:0; top:100%; margin-top:2px; background:var(--bg2); border:1px solid var(--line); border-radius:8px; max-height:180px; overflow-y:auto; z-index:20; display:none;}
.pf-opt{padding:9px 12px; font-size:14px; border-bottom:1px solid var(--line); cursor:pointer;}
.pf-opt:last-child{border-bottom:none;}
.pf-opt:active{background:var(--amber-dim);}
.pf-opt .art{color:var(--dim); font-family:var(--mono); font-size:12px; margin-left:6px;}
.pf-addsuggest{display:none; color:var(--amber); font-size:13px; font-weight:600; padding:6px 2px 2px; cursor:pointer;}
.rm{position:absolute; top:6px; right:8px; color:var(--dim); font-size:18px; background:none;}
.addline{display:block; width:100%; background:transparent; font-size:13px; color:var(--amber); font-weight:600; padding:6px 0; text-align:left;}
nav{
  display:flex; flex-shrink:0; border-top:1px solid var(--line); background:var(--bg2);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav button{
  flex:1; padding:11px 0 9px; background:none; color:var(--dim); font-size:11px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
nav button .ic{font-size:20px;}
nav button.on{color:var(--amber);}
.searchbox{position:sticky; top:0; z-index:5; background:var(--bg); padding-top:2px;}
</style>
</head>
<body>
<div id="shell">
<header>
  <h1 id="hdrTitle">Гараж</h1>
  <span class="crumb" id="hdrCrumb"></span>
  <button class="header-sort hidden" id="hdrSort" data-action="toggleSort" aria-label="Переключить сортировку"><span id="hdrSortIcon">↓</span></button>
</header>

<main id="main">

  <section class="screen active" id="s-cars">
    <div class="card" id="carsCard"></div>
    <button class="btn" data-action="showAddCar">+ Добавить автомобиль</button>
    <div class="storage-status" id="storageStatus"></div>
  </section>

  <section class="screen" id="s-history">
    <div class="searchbox"><input id="historySearch" placeholder="Поиск по виду работы, заметке или запчасти"></div>
    <div id="historyBody"></div>
  </section>
  <section class="screen" id="s-entryForm"></section>
  <section class="screen" id="s-renameCar"></section>

  <section class="screen" id="s-parts">
    <div class="searchbox"><input id="partSearch" placeholder="Поиск по названию или артикулу"></div>
    <div class="card" id="partsCard"></div>
    <button class="btn" data-action="showAddPart">+ Добавить запчасть</button>
  </section>

  <section class="screen" id="s-addPart"></section>
  <section class="screen" id="s-addCar"></section>

  <section class="screen" id="s-maint">
    <div class="card" id="maintCard"></div>
    <button class="btn" data-action="showReminderForm">+ Добавить напоминание</button>
  </section>
  <section class="screen" id="s-reminderForm"></section>

</main>

<nav>
  <button id="navCars" class="on" data-action="switchTab" data-tab="cars"><span class="ic">🚗</span>Автомобили</button>
  <button id="navParts" data-action="switchTab" data-tab="parts"><span class="ic">🔧</span>Запчасти</button>
  <button id="navMaint" data-action="switchTab" data-tab="maint"><span class="ic">🔔</span>ТО</button>
</nav>

<div class="back-fab hidden" id="backFab">
  <button class="btn secondary" data-action="backToCar">‹ К автомобилю</button>
  <button class="btn" data-action="go" data-where="addEntry">+ Добавить данные</button>
</div>

<div class="entry-fab hidden" id="entryFab">
  <button class="btn" data-action="saveEntry">Сохранить запись</button>
  <div class="entry-fab-row" id="entryFabRow"></div>
</div>

<div class="delete-fab hidden" id="deleteFab"></div>
</div>

<script>
'use strict';

/* =========================================================================
 * Запрет масштабирования
 * ========================================================================= */
(function lockZoom(){
  try {
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    document.addEventListener('gestureend', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
    document.addEventListener('touchmove', e => {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
  } catch (_) {}
})();

/* =========================================================================
 * Telegram bootstrap
 * ========================================================================= */
const TG = (() => {
  try {
    const app = window.Telegram?.WebApp || null;
    if (app) { app.ready(); app.expand(); }
    return app;
  } catch (e) {
    console.warn('Telegram WebApp init failed:', e);
    return null;
  }
})();

const Haptics = {
  impact(style = 'light') {
    try { TG?.HapticFeedback?.impactOccurred(style); } catch (_) {}
  },
  notify(type = 'success') {
    try { TG?.HapticFeedback?.notificationOccurred(type); } catch (_) {}
  }
};

const Dialog = {
  confirm(message) {
    return new Promise(resolve => {
      if (TG?.showConfirm) {
        try { TG.showConfirm(message, ok => resolve(!!ok)); return; } catch (_) {}
      }
      resolve(window.confirm(message));
    });
  },
  alert(message) {
    return new Promise(resolve => {
      if (TG?.showAlert) {
        try { TG.showAlert(message, () => resolve()); return; } catch (_) {}
      }
      window.alert(message);
      resolve();
    });
  }
};

/* =========================================================================
 * Settings (persisted)
 * ========================================================================= */
const Settings = (() => {
  const KEY = 'garage_settings_v1';
  const defaults = { sortOrder: 'desc' };

  let state = { ...defaults };

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) Object.assign(state, JSON.parse(raw));
    } catch (_) {}
    return state;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {}
  }
  function get(k) { return state[k]; }
  function set(k, v) { state[k] = v; save(); }

  return { load, get, set, get state() { return state; } };
})();

/* =========================================================================
 * Storage module
 * ========================================================================= */
const Storage = (() => {
  const MAX_VALUE_BYTES = 4000; /* лимит Telegram — 4096 байт на значение; берём с запасом */
  const encoder = new TextEncoder();
  const queues = new Map();
  let cloudAvailable = false;
  let warningShown = false;
  let lastError = null;

  const cs = () => TG?.CloudStorage || null;
  const hasCloud = () => !!cs();
  const delay = ms => new Promise(r => setTimeout(r, ms));

  /* Режем строку на части по РЕАЛЬНОМУ размеру в байтах (UTF-8), а не по
     количеству символов JS. Важно для кириллицы: один русский символ в
     UTF-8 — это 2 байта, а не 1, так что расчёт "по символам" на русском
     тексте фактически превышал лимит Telegram почти вдвое и Telegram
     молча отбрасывал такие значения. */
  function chunkByBytes(str, maxBytes) {
    const chars = Array.from(str);
    const chunks = [];
    let current = '';
    let bytes = 0;
    for (const ch of chars) {
      const chBytes = encoder.encode(ch).length;
      if (bytes + chBytes > maxBytes && current) {
        chunks.push(current);
        current = ch;
        bytes = chBytes;
      } else {
        current += ch;
        bytes += chBytes;
      }
    }
    if (current) chunks.push(current);
    return chunks;
  }

  function csSetItem(key, value) {
    return new Promise(resolve => {
      const c = cs();
      if (!c) return resolve(false);
      try {
        c.setItem(key, value, (err, ok) => {
          if (err) lastError = String(err);
          resolve(!err && ok !== false);
        });
      } catch (e) { lastError = String(e?.message || e); resolve(false); }
    });
  }
  async function csSetItemRetry(key, value, tries = 3) {
    for (let i = 0; i < tries; i++) {
      if (await csSetItem(key, value)) return true;
      await delay(200 * (i + 1));
    }
    return false;
  }
  function csGetItem(key) {
    return new Promise(resolve => {
      const c = cs();
      if (!c) return resolve('');
      try {
        c.getItem(key, (err, v) => {
          if (err) lastError = String(err);
          resolve(err ? '' : String(v ?? ''));
        });
      } catch (e) { lastError = String(e?.message || e); resolve(''); }
    });
  }
  function csGetItems(keys) {
    return new Promise(resolve => {
      if (!keys.length) return resolve({});
      const c = cs();
      if (!c) return resolve({});
      try {
        c.getItems(keys, (err, values) => {
          if (err) lastError = String(err);
          const src = !err && values && typeof values === 'object' ? values : {};
          const out = {};
          keys.forEach(k => { out[k] = String(src[k] ?? ''); });
          resolve(out);
        });
      } catch (e) { lastError = String(e?.message || e); resolve({}); }
    });
  }
  function csRemoveItems(keys) {
    return new Promise(resolve => {
      if (!keys.length) return resolve(true);
      const c = cs();
      if (!c) return resolve(false);
      try { c.removeItems(keys, (err, ok) => resolve(!err && ok !== false)); }
      catch (_) { resolve(false); }
    });
  }
  async function csRemoveItemsRetry(keys, tries = 3) {
    if (!keys.length) return true;
    for (let i = 0; i < tries; i++) {
      if (await csRemoveItems(keys)) return true;
      await delay(200 * (i + 1));
    }
    return false;
  }
  function csGetKeys() {
    return new Promise(resolve => {
      const c = cs();
      if (!c) return resolve([]);
      try { c.getKeys((err, keys) => resolve(!err && Array.isArray(keys) ? keys : [])); }
      catch (_) { resolve([]); }
    });
  }

  async function probe() {
    if (!hasCloud()) return false;
    const key = '__probe';
    const token = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    try {
      if (!(await csSetItemRetry(key, token))) return false;
      const back = await csGetItem(key);
      await csRemoveItems([key]);
      return back === token;
    } catch (e) { lastError = String(e?.message || e); return false; }
  }

  const local = {
    get(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw == null ? fallback : (JSON.parse(raw) ?? fallback);
      } catch (_) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; }
      catch (_) { return false; }
    }
  };

  function parseMeta(raw) {
    if (!raw) return null;
    try {
      const m = JSON.parse(raw);
      if (!m || typeof m.version !== 'string' || !Number.isInteger(m.n) || m.n < 1) return null;
      return m;
    } catch (_) { return null; }
  }
  function makeVersion() {
    return `v${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
  }
  async function readChunked(keys) {
    const values = await csGetItems(keys);
    if (keys.some(k => values[k] === '')) return { ok: false, data: null };
    try { return { ok: true, data: JSON.parse(keys.map(k => values[k]).join('')) }; }
    catch (_) { return { ok: false, data: null }; }
  }
  async function loadCloud(name) {
    const meta = parseMeta(await csGetItem(`${name}_meta`));
    if (meta) {
      const keys = Array.from({ length: meta.n }, (_, i) => `${name}_${meta.version}_${i}`);
      const r = await readChunked(keys);
      if (r.ok) return r;
    }
    const legacyN = Number.parseInt(await csGetItem(`${name}_n`), 10) || 0;
    if (legacyN > 0) {
      const keys = Array.from({ length: legacyN }, (_, i) => `${name}_${i}`);
      const r = await readChunked(keys);
      if (r.ok) return r;
    }
    return { ok: false, data: null };
  }
  async function persistCloud(name, dataObj) {
    const str = JSON.stringify(dataObj);
    const chunks = chunkByBytes(str, MAX_VALUE_BYTES);
    if (!chunks.length) chunks.push('null');

    const prevMeta = parseMeta(await csGetItem(`${name}_meta`));
    const version = makeVersion();
    const keys = chunks.map((_, i) => `${name}_${version}_${i}`);

    for (let i = 0; i < chunks.length; i++) {
      if (!(await csSetItemRetry(keys[i], chunks[i]))) return false;
    }
    const meta = JSON.stringify({ version, n: chunks.length, savedAt: Date.now() });
    if (!(await csSetItemRetry(`${name}_meta`, meta))) return false;

    if (prevMeta) {
      const oldKeys = Array.from({ length: prevMeta.n }, (_, i) => `${name}_${prevMeta.version}_${i}`);
      await csRemoveItemsRetry(oldKeys);
    }
    const legacyN = Number.parseInt(await csGetItem(`${name}_n`), 10) || 0;
    if (legacyN > 0) {
      const legacyKeys = Array.from({ length: legacyN }, (_, i) => `${name}_${i}`);
      legacyKeys.push(`${name}_n`);
      await csRemoveItemsRetry(legacyKeys);
    }
    return true;
  }

  /* Удаляет ключи "name_*", оставшиеся от прежних версий (например,
     после сохранения, при котором не удалось стереть старые чанки).
     CloudStorage у Telegram ограничен 1024 ключами на пользователя,
     так что такой "мусор" со временем может забить весь лимит и
     заблокировать любые новые сохранения. Удаление ключей, в отличие
     от записи, не требует свободного места, поэтому эту очистку можно
     выполнять даже когда лимит уже исчерпан. */
  async function gcOrphans(name) {
    try {
      const allKeys = await csGetKeys();
      const prefix = `${name}_`;
      const own = allKeys.filter(k => k.startsWith(prefix));
      if (!own.length) return;

      const keep = new Set();
      const meta = parseMeta(await csGetItem(`${name}_meta`));
      if (meta) {
        keep.add(`${name}_meta`);
        for (let i = 0; i < meta.n; i++) keep.add(`${name}_${meta.version}_${i}`);
      }
      const legacyN = Number.parseInt(await csGetItem(`${name}_n`), 10) || 0;
      if (legacyN > 0) {
        keep.add(`${name}_n`);
        for (let i = 0; i < legacyN; i++) keep.add(`${name}_${i}`);
      }
      const orphans = own.filter(k => !keep.has(k));
      if (orphans.length) await csRemoveItemsRetry(orphans);
    } catch (_) {}
  }

  async function init() {
    if (hasCloud()) {
      await Promise.allSettled([gcOrphans('cars'), gcOrphans('parts')]);
    }
    cloudAvailable = await probe();
    if (!cloudAvailable) showWarning();
    return cloudAvailable;
  }

  function persist(name, dataObj) {
    const snapshot = clone(dataObj);
    const localSaved = local.set(name, snapshot);
    if (!localSaved && !cloudAvailable) {
      showWarning('⚠️ Не удалось сохранить данные ни в облако, ни локально.');
    }
    if (!cloudAvailable) return Promise.resolve(localSaved);

    const prev = queues.get(name) || Promise.resolve();
    const next = prev.catch(() => {}).then(async () => {
      const ok = await persistCloud(name, snapshot);
      if (!ok) showWarning('⚠️ Облачная синхронизация временно недоступна. Локальная копия сохранена.');
      return ok;
    });
    queues.set(name, next);
    return next;
  }

  async function load(name, fallback) {
    if (cloudAvailable) {
      const cloud = await loadCloud(name);
      if (cloud.ok) {
        local.set(name, cloud.data);
        return cloud.data;
      }
    }
    return local.get(name, fallback);
  }

  function showWarning(message = '⚠️ Облачная синхронизация недоступна — данные сохраняются только на этом устройстве.') {
    if (warningShown) return;
    warningShown = true;
    const banner = document.createElement('div');
    banner.id = 'storageWarning';
    banner.style.cssText = 'background:#5a4326;color:#e08a2c;font-size:12px;line-height:1.4;padding:8px 14px;text-align:center;';
    banner.textContent = message;
    const shell = document.getElementById('shell');
    shell.insertBefore(banner, shell.querySelector('header').nextSibling);
  }

  function clone(value) {
    if (typeof structuredClone === 'function') {
      try { return structuredClone(value); } catch (_) {}
    }
    return JSON.parse(JSON.stringify(value));
  }

  /* Сколько ключей CloudStorage занято данными приложения (лимит — 1024 на
     пользователя у Telegram). Считает только "свои" ключи (с префиксами
     cars_ и parts_), поэтому число отражает именно то, что ограничивает
     сохранение новых записей. */
  async function usage() {
    if (!hasCloud()) return null;
    try {
      const allKeys = await csGetKeys();
      const used = allKeys.filter(k => k.startsWith('cars_') || k.startsWith('parts_')).length;
      const max = 1024;
      return { used, max, remaining: Math.max(0, max - used) };
    } catch (_) { return null; }
  }

  /* Диагностика — почему облако недоступно/не пишется. Показываем прямо в
     интерфейсе (не у всех есть доступ к консоли разработчика внутри Telegram). */
  function diagnostics() {
    return {
      hasTelegramObj: !!window.Telegram,
      hasWebApp: !!window.Telegram?.WebApp,
      hasCloudStorage: hasCloud(),
      platform: TG?.platform || '—',
      version: TG?.version || '—',
      cloudAvailable,
      lastError: lastError || '—'
    };
  }

  return {
    init, load, persist, usage, diagnostics,
    chunkSize: MAX_VALUE_BYTES,
    isCloud: () => cloudAvailable, hasCloud
  };
})();

/* =========================================================================
 * Migrations
 * ========================================================================= */
const Migrations = {
  CARS_VERSION: 4,
  PARTS_VERSION: 2,

  run(rawCars, rawParts) {
    return {
      cars: this.migrateCars(rawCars),
      parts: this.migrateParts(rawParts)
    };
  },

  migrateCars(value) {
    if (!Array.isArray(value)) return [];
    return value
      .filter(car => car && typeof car === 'object')
      .map(car => ({
        schema: this.CARS_VERSION,
        id: safeId(car.id),
        name: text(car.name).trim() || 'Без названия',
        entries: this.migrateEntries(car.entries),
        currentKm: cleanNumber(car.currentKm) || null,
        reminders: this.migrateReminders(car.reminders)
      }));
  },

  migrateReminders(value) {
    if (!Array.isArray(value)) return [];
    return value
      .filter(r => r && typeof r === 'object')
      .map(r => ({
        id: safeId(r.id),
        title: text(r.title).trim(),
        intervalKm: cleanNumber(r.intervalKm) || null,
        dueKm: cleanNumber(r.dueKm)
      }))
      .filter(r => r.title && r.dueKm > 0);
  },

  migrateEntries(value) {
    if (!Array.isArray(value)) return [];
    return value
      .filter(e => e && typeof e === 'object')
      .map(e => ({
        schema: this.CARS_VERSION,
        id: safeId(e.id),
        date: text(e.date),
        km: cleanNumber(e.km),
        mh: cleanNumber(e.mh),
        work: text(e.work),
        note: text(e.note),
        items: this.migrateItems(e.items)
      }))
      .filter(e => e.date || e.work);
  },

  migrateItems(value) {
    if (!Array.isArray(value)) return [];
    return value
      .filter(it => it && typeof it === 'object')
      .map(it => ({ name: text(it.name).trim(), article: text(it.article).trim() }))
      .filter(it => it.name);
  },

  migrateParts(value) {
    if (!Array.isArray(value)) return [];
    const seen = new Set();
    return value
      .filter(p => p && typeof p === 'object' && text(p.name).trim())
      .map(p => ({
        schema: this.PARTS_VERSION,
        id: safeId(p.id),
        name: text(p.name).trim(),
        article: text(p.article).trim()
      }))
      .filter(p => {
        const key = `${p.name.toLowerCase()}|${p.article.toLowerCase()}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
  }
};

/* =========================================================================
 * Store
 * ========================================================================= */
const Store = (() => {
  let cars = [];
  let parts = [];
  let curCarId = null;
  let curEntryId = null;
  let curTab = 'cars';
  let entryFormBaseline = null;

  let entriesRev = 0;
  const sortedCache = new Map();

  const listeners = new Set();
  function emit() { listeners.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }); }
  function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  function bumpRev() { entriesRev++; }

  return {
    get cars() { return cars; },
    set cars(v) { cars = v; bumpRev(); emit(); },
    get parts() { return parts; },
    set parts(v) { parts = v; emit(); },

    get curCarId() { return curCarId; },
    set curCarId(v) { curCarId = v; },
    get curEntryId() { return curEntryId; },
    set curEntryId(v) { curEntryId = v; },
    get curTab() { return curTab; },
    set curTab(v) { curTab = v; },
    get entryFormBaseline() { return entryFormBaseline; },
    set entryFormBaseline(v) { entryFormBaseline = v; },

    currentCar() { return cars.find(c => c.id === curCarId) || null; },
    findPart(id) { return parts.find(p => p.id === id) || null; },

    saveCars() { return Storage.persist('cars', cars); },
    saveParts() { return Storage.persist('parts', parts); },

    addCar(name) {
      cars.push({ schema: Migrations.CARS_VERSION, id: uid(), name, entries: [], currentKm: null, reminders: [] });
      bumpRev(); this.saveCars(); emit();
    },
    renameCar(id, name) {
      const car = cars.find(c => c.id === id);
      if (!car) return false;
      car.name = name;
      this.saveCars(); emit();
      return true;
    },
    removeCar(id) {
      cars = cars.filter(c => c.id !== id);
      bumpRev(); this.saveCars(); emit();
    },
    addEntry(carId, data) {
      const car = cars.find(c => c.id === carId);
      if (!car) return false;
      car.entries.push(data);
      bumpRev(); this.saveCars(); emit();
      return true;
    },
    updateEntry(carId, entryId, data) {
      const car = cars.find(c => c.id === carId);
      if (!car) return false;
      const i = car.entries.findIndex(e => e.id === entryId);
      if (i < 0) return false;
      car.entries[i] = data;
      bumpRev(); this.saveCars(); emit();
      return true;
    },
    removeEntry(carId, entryId) {
      const car = cars.find(c => c.id === carId);
      if (!car) return false;
      car.entries = car.entries.filter(e => e.id !== entryId);
      bumpRev(); this.saveCars(); emit();
      return true;
    },
    setCurrentKm(carId, km) {
      const car = cars.find(c => c.id === carId);
      if (!car) return false;
      car.currentKm = km;
      this.saveCars(); emit();
      return true;
    },
    historyKm(car) {
      return (car.entries || []).reduce((max, e) => Math.max(max, cleanNumber(e.km) || 0), 0);
    },
    effectiveKm(car) {
      return Math.max(this.historyKm(car), cleanNumber(car.currentKm) || 0);
    },
    addReminder(carId, reminder) {
      const car = cars.find(c => c.id === carId);
      if (!car) return false;
      car.reminders.push(reminder);
      this.saveCars(); emit();
      return true;
    },
    updateReminder(carId, id, patch) {
      const car = cars.find(c => c.id === carId);
      if (!car) return false;
      const r = car.reminders.find(x => x.id === id);
      if (!r) return false;
      Object.assign(r, patch);
      this.saveCars(); emit();
      return true;
    },
    removeReminder(carId, id) {
      const car = cars.find(c => c.id === carId);
      if (!car) return false;
      car.reminders = car.reminders.filter(r => r.id !== id);
      this.saveCars(); emit();
      return true;
    },
    allReminders() {
      const out = [];
      cars.forEach(car => (car.reminders || []).forEach(r => out.push({ car, reminder: r })));
      return out;
    },
    findReminder(id) {
      for (const car of cars) {
        const r = (car.reminders || []).find(x => x.id === id);
        if (r) return { car, reminder: r };
      }
      return null;
    },
    addPart(part) {
      parts.push(part); this.saveParts(); emit();
    },
    updatePart(id, patch) {
      const p = parts.find(x => x.id === id);
      if (!p) return false;
      Object.assign(p, patch); this.saveParts(); emit();
      return true;
    },
    removePart(id) {
      parts = parts.filter(p => p.id !== id); this.saveParts(); emit();
    },

    getSortedEntries(car, order = 'desc') {
      if (!car) return [];
      const key = `${car.id}:${entriesRev}:${order}`;
      const cached = sortedCache.get(key);
      if (cached) return cached;
      const dir = order === 'asc' ? 1 : -1;
      const sorted = [...car.entries].sort((a, b) =>
        dir * (entryDateValue(a) - entryDateValue(b)) ||
        dir * (cleanNumber(a.km) - cleanNumber(b.km)) ||
        dir * (cleanNumber(a.mh) - cleanNumber(b.mh))
      );
      sortedCache.set(key, sorted);
      for (const k of sortedCache.keys()) {
        if (k.startsWith(`${car.id}:`) && k !== key) {
          const [, rev] = k.split(':');
          if (rev !== String(entriesRev)) sortedCache.delete(k);
        }
      }
      return sorted;
    },

    subscribe,
    emit
  };
})();

/* =========================================================================
 * Helpers
 * ========================================================================= */
function uid() {
  if (window.crypto?.randomUUID) return window.crypto.randomUUID();
  return `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 10)}`;
}
function text(v) { return String(v ?? ''); }
function safeId(v) {
  const id = text(v);
  return /^[A-Za-z0-9_-]+$/.test(id) ? id : uid();
}
function cleanNumber(v) {
  const n = Number(v);
  return Number.isFinite(n) && n >= 0 ? n : 0;
}
function esc(v) {
  return text(v).replace(/[&<>"']/g, ch => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
}
function entryDateValue(entry) {
  const iso = toInputDate(entry?.date || '');
  const time = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? Date.parse(`${iso}T00:00:00`) : NaN;
  return Number.isFinite(time) ? time : 0;
}
function odoLabel(entry) {
  const labels = [];
  if (cleanNumber(entry?.km)) labels.push(`${cleanNumber(entry.km)} км`);
  if (cleanNumber(entry?.mh)) labels.push(`${cleanNumber(entry.mh)} м.ч.`);
  return labels.length ? labels.join(' · ') : '—';
}
function toInputDate(value) {
  const d = text(value);
  if (!d) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
  const m = d.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  return m ? `${m[3]}-${m[2]}-${m[1]}` : '';
}
function fromInputDate(value) {
  const m = text(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}.${m[2]}.${m[1]}` : '';
}
function debounce(fn, ms = 200) {
  let t = null;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}
function autoGrow(el) {
  if (!el || el.tagName !== 'TEXTAREA') return;
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}
function bindAutoGrow(el) {
  if (!el) return;
  autoGrow(el);
  el.addEventListener('input', () => autoGrow(el));
}
function formatNumber(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

/* =========================================================================
 * Router
 * ========================================================================= */
const Router = (() => {
  let current = 's-cars';
  const FAB_SCREENS = new Set(['s-history']);
  const SORT_SCREENS = new Set(['s-history']);
  const ENTRY_FAB_SCREENS = new Set(['s-entryForm']);
  const DELETE_FAB_SCREENS = new Set(['s-renameCar']);

  function show(id) {
    const target = document.getElementById(id);
    if (!target) return;
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    target.classList.add('active');
    const main = document.getElementById('main');
    if (main) main.scrollTop = 0;
    current = id;

    const fab = document.getElementById('backFab');
    if (fab) fab.classList.toggle('hidden', !FAB_SCREENS.has(id));

    const entryFab = document.getElementById('entryFab');
    if (entryFab) entryFab.classList.toggle('hidden', !ENTRY_FAB_SCREENS.has(id));

    const deleteFab = document.getElementById('deleteFab');
    if (deleteFab) deleteFab.classList.toggle('hidden', !DELETE_FAB_SCREENS.has(id));

    const sortBtn = document.getElementById('hdrSort');
    if (sortBtn) sortBtn.classList.toggle('hidden', !SORT_SCREENS.has(id));
  }

  function setHeader(title, crumb = '') {
    document.getElementById('hdrTitle').textContent = title;
    document.getElementById('hdrCrumb').textContent = crumb;
  }

  function switchTab(tab) {
    Store.curTab = tab;
    document.getElementById('navCars').classList.toggle('on', tab === 'cars');
    document.getElementById('navParts').classList.toggle('on', tab === 'parts');
    document.getElementById('navMaint').classList.toggle('on', tab === 'maint');
    if (tab === 'cars') {
      Views.renderCars();
      show('s-cars');
      setHeader('Гараж');
    } else if (tab === 'parts') {
      Views.renderParts();
      show('s-parts');
      setHeader('Запчасти');
    } else {
      Views.renderMaint();
      show('s-maint');
      setHeader('ТО');
    }
  }

  return { show, setHeader, switchTab, get current() { return current; } };
})();

/* =========================================================================
 * Views
 * ========================================================================= */
const Views = (() => {

  /* ---------- Cars list ---------- */
  function renderCars() {
    renderStorageStatus();
    const card = document.getElementById('carsCard');
    const cars = Store.cars;
    if (!cars.length) {
      card.innerHTML = '<div class="empty">Пока нет ни одного автомобиля.<br>Добавьте первый, чтобы вести историю обслуживания.</div>';
      return;
    }
    const order = Settings.get('sortOrder');
    card.innerHTML = cars.map(car => {
      const sorted = Store.getSortedEntries(car, order);
      const latest = sorted[0];

      /* Дата и км — из последней записи (как раньше). */
      const datePart = latest ? esc(latest.date) : '';
      const kmPart = latest && cleanNumber(latest.km) ? `${formatNumber(cleanNumber(latest.km))} км` : '';

      /* М.ч. — из самой свежей записи, где они заполнены. */
      const lastMh = latestMh(car, order);
      const mhPart = lastMh ? `${formatNumber(cleanNumber(lastMh.mh))} м.ч.` : '';

      const summaryParts = [datePart, kmPart, mhPart].filter(Boolean);
      const sub = summaryParts.length ? summaryParts.join(' · ') : 'Нет записей';

      return `<div class="list-row" data-action="openCar" data-id="${esc(car.id)}">
        <div class="main"><div class="t">${esc(car.name)}</div><div class="s">${sub}</div></div>
        <div class="row-actions">
          <button class="icon-btn" data-action="renameCar" data-id="${esc(car.id)}" aria-label="Переименовать">✏️</button>
          <div class="arrow">›</div>
        </div>
      </div>`;
    }).join('');
  }

  /* Последняя запись (по выбранному порядку), где заполнены м.ч. */
  function latestMh(car, order) {
    if (!car) return null;
    const sorted = Store.getSortedEntries(car, order);
    return sorted.find(e => cleanNumber(e.mh) > 0) || null;
  }

  /* ---------- Storage status ---------- */
  async function renderStorageStatus() {
    const el = document.getElementById('storageStatus');
    if (!el) return;

    if (!Storage.hasCloud()) {
      el.textContent = 'Нет доступа к Telegram CloudStorage — данные сохраняются только на этом устройстве.';
      el.className = 'storage-status warn';
      return;
    }

    if (!Storage.isCloud()) {
      const d = Storage.diagnostics();
      el.textContent = `Синхронизация не работает (платформа: ${d.platform}, версия: ${d.version}` +
        (d.lastError !== '—' ? `, ошибка: ${d.lastError}` : '') +
        '). Данные сохраняются только на этом устройстве.';
      el.className = 'storage-status danger';
      return;
    }

    const u = await Storage.usage();
    if (!u) { el.textContent = ''; el.className = 'storage-status'; return; }

    const pct = Math.round((u.used / u.max) * 100);
    let text = `Облако: занято ${u.used} из ${u.max} ключей (${pct}%)`;

    const allEntries = Store.cars.flatMap(c => c.entries || []);
    if (allEntries.length) {
      const avgBytes = allEntries.reduce((sum, e) => sum + new TextEncoder().encode(JSON.stringify(e)).length, 0) / allEntries.length;
      if (avgBytes > 0) {
        const estimate = Math.floor((u.remaining * Storage.chunkSize) / avgBytes);
        text += ` · осталось места примерно на ${formatNumber(estimate)} записей`;
      }
    }

    el.textContent = text;
    el.className = 'storage-status' + (u.remaining < 30 ? ' danger' : u.remaining < 100 ? ' warn' : '');
  }

  /* ---------- Add car ---------- */
  function showAddCar() {
    document.getElementById('s-addCar').innerHTML = `
      <label>Название автомобиля</label>
      <input id="newCarName" placeholder="Например: Хонда СБР 600" autocomplete="off">
      <button class="btn" data-action="addCar">Сохранить</button>
      <button class="btn secondary" data-action="switchTab" data-tab="cars">Отмена</button>`;
    Router.show('s-addCar');
    Router.setHeader('Новый автомобиль');
    setTimeout(() => document.getElementById('newCarName')?.focus(), 0);
  }

  function addCar() {
    const input = document.getElementById('newCarName');
    const name = input?.value.trim() || '';
    if (!name) { input?.focus(); return; }
    Store.addCar(name);
    Haptics.notify('success');
    Router.switchTab('cars');
  }

  /* ---------- Rename car ---------- */
  function showRenameCar(id) {
    const car = Store.cars.find(c => c.id === id);
    if (!car) return Router.switchTab('cars');
    const km = Store.effectiveKm(car);
    document.getElementById('s-renameCar').innerHTML = `
      <label>Новое название</label>
      <input id="renameCarName" value="${esc(car.name)}" autocomplete="off">
      <label>Текущий пробег, км</label>
      <input id="renameCarKm" type="number" min="0" inputmode="numeric" value="${km || ''}">
      <button class="btn" data-action="saveRenameCar" data-id="${esc(id)}">Сохранить</button>
      <button class="btn secondary" data-action="backToCar">Отмена</button>
      `;
    const deleteFab = document.getElementById('deleteFab');
    if (deleteFab) {
      deleteFab.innerHTML = `<button class="btn danger" data-action="deleteCar" data-id="${esc(id)}">Удалить автомобиль</button>`;
    }
    Router.show('s-renameCar');
    Router.setHeader('Переименовать', 'Автомобиль');
    setTimeout(() => {
      const el = document.getElementById('renameCarName');
      el?.focus();
      el?.setSelectionRange(el.value.length, el.value.length);
    }, 0);
  }

  async function saveRenameCar(id) {
    const car = Store.cars.find(c => c.id === id);
    if (!car) return Router.switchTab('cars');

    const input = document.getElementById('renameCarName');
    const name = input?.value.trim() || '';
    if (!name) { input?.focus(); return; }

    const km = readNonNegativeNumber('renameCarKm', 'Пробег');
    if (km == null) return;
    const known = Store.historyKm(car);
    if (km < known) {
      const ok = await Dialog.confirm(
        `Указано меньше, чем пробег из истории обслуживания (${formatNumber(known)} км).\nВсё равно сохранить?`
      );
      if (!ok) return;
    }

    Store.renameCar(id, name);
    Store.setCurrentKm(id, km);
    Haptics.notify('success');
    Router.switchTab('cars');
  }

  /* ---------- Car menu ---------- */
  function openCar(id) {
    const car = Store.cars.find(c => c.id === id);
    if (!car) { Router.switchTab('cars'); return; }
    Store.curCarId = id;
    const search = document.getElementById('historySearch');
    if (search) search.value = '';
    renderHistory();
  }

  async function deleteCar(id) {
    const car = Store.cars.find(c => c.id === id);
    if (!car) return Router.switchTab('cars');
    const ok = await Dialog.confirm(`Удалить «${car.name}» и всю его историю?`);
    if (!ok) return;
    Store.removeCar(car.id);
    if (Store.curCarId === car.id) Store.curCarId = null;
    Haptics.notify('warning');
    Router.switchTab('cars');
  }

  function backToCar() {
    Router.switchTab('cars');
  }

  /* ---------- History ---------- */
  function renderHistory() {
    const car = Store.currentCar();
    if (!car) return Router.switchTab('cars');
    const box = document.getElementById('s-history');
    box.classList.add('has-fab');
    const order = Settings.get('sortOrder');
    const sorted = Store.getSortedEntries(car, order);

    updateSortIcon();

    const search = document.getElementById('historySearch');
    const q = (search?.value || '').trim().toLowerCase();
    const filtered = !q ? sorted : sorted.filter(entry => {
      const haystack = [
        entry.work,
        entry.note,
        ...(entry.items || []).map(it => it.name),
        ...(entry.items || []).map(it => it.article)
      ].filter(Boolean).join(' \u00a0 ').toLowerCase();
      return haystack.includes(q);
    });

    const body = !sorted.length
      ? '<div class="empty">Записей пока нет.</div>'
      : !filtered.length
        ? '<div class="empty">Ничего не найдено.</div>'
        : filtered.map(entry => `
          <div class="entry">
            <div class="top">
              <span>${esc(entry.date)}</span>
              <span class="odo">${odoLabel(entry)}</span>
              <button class="edit-btn" data-action="editEntry" data-id="${esc(entry.id)}" aria-label="Изменить запись">✏️</button>
            </div>
            <div class="work">${esc(entry.work)}</div>
            ${entry.note ? `<div class="note">${esc(entry.note)}</div>` : ''}
            ${(entry.items || []).map(it => `<div class="part"><span>${esc(it.name)}</span><span class="art">${esc(it.article || '')}</span></div>`).join('')}
          </div>`).join('');

    document.getElementById('historyBody').innerHTML = body;
    Router.show('s-history');
    Router.setHeader(car.name, 'История');
  }

  function updateSortIcon() {
    const icon = document.getElementById('hdrSortIcon');
    if (!icon) return;
    icon.textContent = Settings.get('sortOrder') === 'asc' ? '↑' : '↓';
  }

  function toggleSort() {
    const next = Settings.get('sortOrder') === 'asc' ? 'desc' : 'asc';
    Settings.set('sortOrder', next);
    updateSortIcon();
    renderHistory();
    Haptics.impact('light');
  }

  /* ---------- Maintenance reminders ---------- */
  function reminderStatus(car, r) {
    const km = Store.effectiveKm(car);
    const remaining = cleanNumber(r.dueKm) - km;
    const threshold = Math.max(500, (cleanNumber(r.intervalKm) || 0) * 0.1);
    return { remaining, danger: remaining <= 0, warn: remaining > 0 && remaining <= threshold };
  }

  function maintLabel(remaining) {
    return remaining <= 0
      ? `Просрочено на ${formatNumber(Math.abs(remaining))} км`
      : `Через ${formatNumber(remaining)} км`;
  }

  function renderMaint() {
    const card = document.getElementById('maintCard');
    const all = Store.allReminders();
    if (!all.length) {
      card.innerHTML = '<div class="empty">Напоминаний пока нет.</div>';
      return;
    }
    const rows = all
      .map(({ car, reminder }) => ({ car, reminder, ...reminderStatus(car, reminder) }))
      .sort((a, b) => a.remaining - b.remaining);
    card.innerHTML = rows.map(({ car, reminder, remaining, danger, warn }) => `
      <div class="list-row" data-action="showReminderForm" data-id="${esc(reminder.id)}">
        <div class="main">
          <div class="t">${esc(reminder.title)}</div>
          <div class="s">${esc(car.name)}</div>
        </div>
        <div class="maint-badge${danger ? ' danger' : warn ? ' warn' : ''}">${maintLabel(remaining)}</div>
      </div>`).join('');
  }

  /* ---------- Reminder form (create/edit — only from the "ТО" tab) ---------- */
  function showReminderForm(id = null) {
    if (!Store.cars.length) {
      Dialog.alert('Сначала добавьте автомобиль');
      return Router.switchTab('cars');
    }
    let curCar = null, r = null;
    if (id) {
      const found = Store.findReminder(id);
      if (!found) return Router.switchTab('maint');
      curCar = found.car; r = found.reminder;
    }
    const data = r || { title: '', intervalKm: '', dueKm: '' };
    const carOptions = Store.cars.map(c =>
      `<option value="${esc(c.id)}"${curCar && c.id === curCar.id ? ' selected' : ''}>${esc(c.name)}</option>`
    ).join('');

    document.getElementById('s-reminderForm').innerHTML = `
      <label>Автомобиль</label>
      <select id="rf-car">${carOptions}</select>
      <label>Что нужно сделать</label>
      <input id="rf-title" value="${esc(data.title)}" placeholder="Например, замена масла и фильтров" autocomplete="off">
      <label>Обычный интервал, км (необязательно)</label>
      <input id="rf-interval" type="number" min="0" inputmode="numeric" value="${data.intervalKm || ''}" placeholder="Например, 8000">
      <label>Следующая замена при пробеге, км</label>
      <input id="rf-due" type="number" min="0" inputmode="numeric" value="${data.dueKm || ''}" placeholder="Например, 92000">
      <button class="btn" data-action="saveReminder" data-id="${esc(id || '')}">Сохранить</button>
      <button class="btn secondary" data-action="switchTab" data-tab="maint">Отмена</button>
      ${id ? `<button class="btn danger" data-action="deleteReminder" data-id="${esc(id)}" style="margin-top:28px;">Удалить напоминание</button>` : ''}`;
    Router.show('s-reminderForm');
    Router.setHeader(id ? 'Изменить напоминание' : 'Новое напоминание', 'ТО');
    setTimeout(() => document.getElementById('rf-title')?.focus(), 0);
  }

  async function saveReminder(id) {
    const carId = document.getElementById('rf-car')?.value;
    const car = Store.cars.find(c => c.id === carId);
    if (!car) { await Dialog.alert('Выберите автомобиль'); return; }
    const title = document.getElementById('rf-title')?.value.trim() || '';
    if (!title) { await Dialog.alert('Укажите, что нужно сделать'); return; }
    const intervalKm = readNonNegativeNumber('rf-interval', 'Интервал');
    if (intervalKm == null) return;
    const dueKm = readNonNegativeNumber('rf-due', 'Пробег для следующей замены');
    if (dueKm == null) return;
    if (!dueKm) { await Dialog.alert('Укажите пробег, при котором нужно сделать замену'); return; }

    const patch = { title, intervalKm: intervalKm || null, dueKm };
    if (id) {
      const found = Store.findReminder(id);
      if (found && found.car.id !== car.id) {
        Store.removeReminder(found.car.id, id);
        Store.addReminder(car.id, { id, ...patch });
      } else {
        Store.updateReminder(car.id, id, patch);
      }
    } else {
      Store.addReminder(car.id, { id: uid(), ...patch });
    }
    Haptics.notify('success');
    Router.switchTab('maint');
  }

  async function deleteReminder(id) {
    const found = Store.findReminder(id);
    if (!found) return Router.switchTab('maint');
    const ok = await Dialog.confirm('Удалить это напоминание?');
    if (!ok) return;
    Store.removeReminder(found.car.id, id);
    Haptics.notify('warning');
    Router.switchTab('maint');
  }

  /* ---------- Entry form ---------- */
  function showEntryForm(entryId) {
    const car = Store.currentCar();
    if (!car) return Router.switchTab('cars');

    Store.curEntryId = entryId || null;
    const entry = entryId ? car.entries.find(e => e.id === entryId) : null;
    if (entryId && !entry) return renderHistory();

    const data = entry || { date: '', km: '', mh: '', work: '', note: '', items: [{ name: '', article: '' }] };
    const box = document.getElementById('s-entryForm');
    box.innerHTML = `
      <label>Дата</label>
      <input type="date" id="f-date" value="${esc(toInputDate(data.date))}">
      <div class="row2">
        <div><label>Пробег, км</label><input id="f-km" type="number" min="0" step="any" inputmode="decimal" placeholder="—" value="${data.km || ''}"></div>
        <div><label>Мото-часы</label><input id="f-mh" type="number" min="0" step="any" inputmode="decimal" placeholder="—" value="${data.mh || ''}"></div>
      </div>
      <label>Вид работы</label>
      <textarea id="f-work" rows="2" placeholder="Например: Замена фильтров и масла">${esc(data.work)}</textarea>
      <label>Запчасти</label>
      <div id="partsFields"></div>
      <button type="button" class="addline" data-action="addPartField">+ ещё запчасть</button>
      <label>Комментарий / заметка</label>
      <textarea id="f-note" rows="2" placeholder="Дополнительные детали, артикулы, что-то на будущее">${esc(data.note || '')}</textarea>`;

    document.getElementById('entryFabRow').innerHTML = `
      <button class="btn secondary" data-action="cancelEntryForm">Отмена</button>
      ${entryId ? '<button class="btn danger" data-action="deleteEntry">Удалить запись</button>' : ''}`;

    const items = data.items?.length ? data.items : [{ name: '', article: '' }];
    items.forEach(it => addPartField(it.name, it.article));

    bindAutoGrow(document.getElementById('f-work'));
    bindAutoGrow(document.getElementById('f-note'));

    Router.show('s-entryForm');
    Router.setHeader(car.name, entryId ? 'Изменить запись' : 'Новая запись');
    Store.entryFormBaseline = serializeEntryForm();
  }

  function addPartField(name = '', article = '') {
    const container = document.getElementById('partsFields');
    if (!container) return;
    const wrap = document.createElement('div');
    wrap.className = 'partfield';
    wrap.innerHTML = `
      <button type="button" class="rm" aria-label="Удалить строку запчасти" data-action="removePartField">×</button>
      <label>Название</label>
      <div class="pf-wrap">
        <input class="pf-name" value="${esc(name)}" placeholder="Название запчасти/расходника" autocomplete="off">
        <div class="pf-dropdown"></div>
      </div>
      <label>Артикул</label><input class="pf-art" value="${esc(article)}" placeholder="Артикул" autocomplete="off">
      <div class="pf-addsuggest"></div>`;
    container.appendChild(wrap);

    const nameInput = wrap.querySelector('.pf-name');
    const artInput  = wrap.querySelector('.pf-art');
    const dropdown  = wrap.querySelector('.pf-dropdown');
    const addBox    = wrap.querySelector('.pf-addsuggest');

    function refreshDropdown() {
      const q = nameInput.value.trim().toLowerCase();
      if (!q) {
        dropdown.style.display = 'none';
        dropdown.innerHTML = '';
        addBox.style.display = 'none';
        addBox.textContent = '';
        return;
      }
      const matches = Store.parts.filter(p =>
        p.name.toLowerCase().includes(q) || (p.article || '').toLowerCase().includes(q)
      );
      if (matches.length) {
        dropdown.innerHTML = matches.slice(0, 6).map(p =>
          `<div class="pf-opt" data-id="${esc(p.id)}">${esc(p.name)}${p.article ? ` <span class="art">${esc(p.article)}</span>` : ''}</div>`
        ).join('');
        dropdown.style.display = 'block';
      } else {
        dropdown.style.display = 'none';
        dropdown.innerHTML = '';
      }
      refreshAddBox();
    }

    function refreshAddBox() {
      const nv = nameInput.value.trim();
      const av = artInput.value.trim();
      const exact = Store.parts.some(p =>
        p.name.trim().toLowerCase() === nv.toLowerCase() &&
        (p.article || '').trim().toLowerCase() === av.toLowerCase()
      );
      if (nv && av && !exact) {
        addBox.textContent = `+ добавить «${nv}» в каталог запчастей`;
        addBox.style.display = 'block';
      } else {
        addBox.style.display = 'none';
        addBox.textContent = '';
      }
    }

    nameInput.addEventListener('input', debounce(refreshDropdown, 120));
    nameInput.addEventListener('focus', refreshDropdown);
    nameInput.addEventListener('blur', () => setTimeout(() => { dropdown.style.display = 'none'; }, 150));
    artInput.addEventListener('input', debounce(refreshAddBox, 120));

    dropdown.addEventListener('click', ev => {
      const opt = ev.target.closest('.pf-opt');
      if (!opt) return;
      const part = Store.findPart(opt.dataset.id);
      if (!part) return;
      nameInput.value = part.name;
      artInput.value = part.article || '';
      dropdown.style.display = 'none';
      dropdown.innerHTML = '';
      addBox.style.display = 'none';
      addBox.textContent = '';
    });

    addBox.addEventListener('click', () => {
      const nv = nameInput.value.trim();
      const av = artInput.value.trim();
      if (!nv || !av) return;
      const dup = Store.parts.some(p =>
        p.name.toLowerCase() === nv.toLowerCase() &&
        (p.article || '').toLowerCase() === av.toLowerCase()
      );
      if (!dup) Store.addPart({ schema: Migrations.PARTS_VERSION, id: uid(), name: nv, article: av });
      addBox.textContent = dup ? '✓ уже есть в каталоге' : '✓ добавлено в каталог';
      setTimeout(() => { addBox.style.display = 'none'; addBox.textContent = ''; }, 1200);
    });
  }

  function removePartField(btn) {
    btn.closest('.partfield')?.remove();
  }

  function readEntryFormState() {
    const dateEl = document.getElementById('f-date');
    if (!dateEl) return null;
    return {
      date: dateEl.value,
      km: document.getElementById('f-km')?.value ?? '',
      mh: document.getElementById('f-mh')?.value ?? '',
      work: document.getElementById('f-work')?.value.trim() ?? '',
      note: document.getElementById('f-note')?.value.trim() ?? '',
      items: [...document.querySelectorAll('#partsFields .partfield')].map(f => ({
        name: f.querySelector('.pf-name')?.value.trim() ?? '',
        article: f.querySelector('.pf-art')?.value.trim() ?? ''
      }))
    };
  }
  function serializeEntryForm() {
    const s = readEntryFormState();
    return s ? JSON.stringify(s) : null;
  }
  function isEntryFormDirty() {
    if (!document.getElementById('s-entryForm').classList.contains('active')) return false;
    if (Store.entryFormBaseline == null) return false;
    return serializeEntryForm() !== Store.entryFormBaseline;
  }

  function readNonNegativeNumber(id, label) {
    const input = document.getElementById(id);
    const raw = input?.value.trim() || '';
    if (!raw) return 0;
    const v = Number(raw);
    if (!Number.isFinite(v) || v < 0) {
      Dialog.alert(`${label} должен быть неотрицательным числом`);
      input?.focus();
      return null;
    }
    return v;
  }

  async function saveEntry(skipNav = false) {
    const car = Store.currentCar();
    if (!car) return false;

    const date = document.getElementById('f-date')?.value || '';
    const km = readNonNegativeNumber('f-km', 'Пробег');
    if (km == null) return false;
    const mh = readNonNegativeNumber('f-mh', 'Мото-часы');
    if (mh == null) return false;
    const work = document.getElementById('f-work')?.value.trim() || '';
    const note = document.getElementById('f-note')?.value.trim() || '';

    if (!date || !work) {
      await Dialog.alert('Укажите дату и вид работы');
      return false;
    }

    const items = [...document.querySelectorAll('#partsFields .partfield')]
      .map(f => ({
        name: f.querySelector('.pf-name')?.value.trim() || '',
        article: f.querySelector('.pf-art')?.value.trim() || ''
      }))
      .filter(it => it.name);

    const data = {
      schema: Migrations.CARS_VERSION,
      id: Store.curEntryId || uid(),
      date: fromInputDate(date),
      km, mh, work, note, items
    };

    const ok = Store.curEntryId
      ? Store.updateEntry(car.id, Store.curEntryId, data)
      : Store.addEntry(car.id, data);

    if (!ok) { await Dialog.alert('Не удалось сохранить запись'); return false; }

    if (!Store.curEntryId) Store.curEntryId = data.id;
    Store.entryFormBaseline = serializeEntryForm();
    Haptics.notify('success');

    if (!skipNav) {
      Store.entryFormBaseline = null;
      Store.curEntryId = null;
      renderHistory();
    }
    return true;
  }

  async function deleteEntry() {
    const car = Store.currentCar();
    if (!car || !Store.curEntryId) return;
    const ok = await Dialog.confirm('Удалить эту запись?');
    if (!ok) return;
    Store.removeEntry(car.id, Store.curEntryId);
    Store.curEntryId = null;
    Store.entryFormBaseline = null;
    Haptics.notify('warning');
    renderHistory();
  }

  function cancelEntryForm() {
    guardLeaveEntryForm(() => {
      Store.entryFormBaseline = null;
      Store.curEntryId = null;
      renderHistory();
    });
  }

  /* ---------- Parts ---------- */
  function renderParts() {
    const search = document.getElementById('partSearch');
    const q = (search?.value || '').trim().toLowerCase();
    const filtered = Store.parts.filter(p =>
      p.name.toLowerCase().includes(q) || (p.article || '').toLowerCase().includes(q)
    );
    const card = document.getElementById('partsCard');

    if (!Store.parts.length) {
      card.innerHTML = '<div class="empty">Каталог пуст. Добавьте первую запчасть.</div>';
      return;
    }
    if (!filtered.length) {
      card.innerHTML = '<div class="empty">Ничего не найдено.</div>';
      return;
    }
    card.innerHTML = filtered.map(p => `
      <div class="list-row" data-action="editPart" data-id="${esc(p.id)}">
        <div class="main"><div class="t">${esc(p.name)}</div><div class="s">${esc(p.article || '—')}</div></div>
        <div class="arrow">›</div></div>`).join('');
  }

  function showAddPart(id = null) {
    const part = id ? Store.findPart(id) : null;
    if (id && !part) return Router.switchTab('parts');

    const data = part || { name: '', article: '' };
    document.getElementById('s-addPart').innerHTML = `
      <label>Название</label><input id="p-name" value="${esc(data.name)}" placeholder="Название запчасти" autocomplete="off">
      <label>Артикул</label><input id="p-art" value="${esc(data.article)}" placeholder="Артикул" autocomplete="off">
      <button class="btn" data-action="savePart" data-id="${esc(id || '')}">Сохранить</button>
      ${id ? '<button class="btn danger" data-action="delPart" data-id="' + esc(id) + '">Удалить</button>' : ''}
      <button class="btn secondary" data-action="switchTab" data-tab="parts">Отмена</button>`;
    Router.show('s-addPart');
    Router.setHeader(id ? 'Изменить запчасть' : 'Новая запчасть');
  }

  async function savePart(id) {
    const nameInput = document.getElementById('p-name');
    const name = nameInput?.value.trim() || '';
    const article = document.getElementById('p-art')?.value.trim() || '';
    if (!name) { nameInput?.focus(); return; }
    if (!article) {
      const ok = await Dialog.confirm('Вы забыли внести артикул. Сохранить без артикула?');
      if (!ok) return;
    }
    const editId = id || null;
    const dup = Store.parts.some(p =>
      p.id !== editId &&
      p.name.toLowerCase() === name.toLowerCase() &&
      (p.article || '').toLowerCase() === article.toLowerCase()
    );
    if (dup) { await Dialog.alert('Такая запчасть уже есть в каталоге'); return; }

    if (editId) {
      Store.updatePart(editId, { name, article });
    } else {
      Store.addPart({ schema: Migrations.PARTS_VERSION, id: uid(), name, article });
    }
    Haptics.notify('success');
    Router.switchTab('parts');
  }

  async function delPart(id) {
    if (!id) return;
    const ok = await Dialog.confirm('Удалить запчасть из каталога?');
    if (!ok) return;
    Store.removePart(id);
    Haptics.notify('warning');
    Router.switchTab('parts');
  }

  return {
    renderCars, showAddCar, addCar, showRenameCar, saveRenameCar,
    openCar, deleteCar, backToCar,
    renderHistory, toggleSort,
    renderStorageStatus,
    renderMaint,
    showReminderForm, saveReminder, deleteReminder,
    showEntryForm,
    addPartField, removePartField, saveEntry, deleteEntry, cancelEntryForm,
    renderParts, showAddPart, savePart, delPart,
    isEntryFormDirty
  };
})();

/* =========================================================================
 * Global event delegation
 * ========================================================================= */
function handleAction(action, el) {
  switch (action) {
    case 'switchTab':          return Router.switchTab(el.dataset.tab);
    case 'showAddCar':         return Views.showAddCar();
    case 'addCar':             return Views.addCar();
    case 'openCar':            return Views.openCar(el.dataset.id);
    case 'renameCar':          return Views.showRenameCar(el.dataset.id);
    case 'saveRenameCar':      return Views.saveRenameCar(el.dataset.id);
    case 'deleteCar':          return Views.deleteCar(el.dataset.id);
    case 'backToCar':          return Views.backToCar();
    case 'toggleSort':         return Views.toggleSort();
    case 'showReminderForm':   return Views.showReminderForm(el.dataset.id || null);
    case 'saveReminder':       return Views.saveReminder(el.dataset.id || null);
    case 'deleteReminder':     return Views.deleteReminder(el.dataset.id);
    case 'go':                 return go(el.dataset.where);
    case 'editEntry':          return Views.showEntryForm(el.dataset.id);
    case 'addPartField':       return Views.addPartField();
    case 'removePartField':    return Views.removePartField(el);
    case 'saveEntry':          return Views.saveEntry();
    case 'deleteEntry':        return Views.deleteEntry();
    case 'cancelEntryForm':    return Views.cancelEntryForm();
    case 'showAddPart':        return Views.showAddPart();
    case 'editPart':           return Views.showAddPart(el.dataset.id);
    case 'savePart':           return Views.savePart(el.dataset.id || null);
    case 'delPart':            return Views.delPart(el.dataset.id);
  }
}

function go(where) {
  if (where === 'history')       Views.renderHistory();
  else if (where === 'addEntry') Views.showEntryForm(null);
}

async function guardLeaveEntryForm(afterFn) {
  if (!Views.isEntryFormDirty()) { afterFn(); return; }
  const wantsSave = await Dialog.confirm(
    'Вы не сохранили изменения.\n\nОК — сохранить и выйти\nОтмена — выйти без сохранения'
  );
  if (wantsSave) {
    const ok = await Views.saveEntry(true);
    if (!ok) {
      const discard = await Dialog.confirm('Чтобы сохранить, нужно указать дату и вид работы.\nВыйти без сохранения?');
      if (!discard) return;
    }
  }
  Store.entryFormBaseline = null;
  afterFn();
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'renameCar' || action === 'editEntry' || action === 'removePartField') {
    ev.stopPropagation();
  }

  if (action === 'switchTab' || action === 'backToCar') {
    ev.preventDefault();
    guardLeaveEntryForm(() => handleAction(action, el));
    return;
  }
  handleAction(action, el);
});

(function bindSearch() {
  const input = document.getElementById('partSearch');
  if (!input) return;
  input.addEventListener('input', debounce(() => Views.renderParts(), 150));
})();

(function bindHistorySearch() {
  const input = document.getElementById('historySearch');
  if (!input) return;
  input.addEventListener('input', debounce(() => Views.renderHistory(), 150));
})();

/* =========================================================================
 * Init
 * ========================================================================= */
Store.subscribe(() => Views.renderStorageStatus());

(async function init() {
  Settings.load();
  await Storage.init();

  const [rawCars, rawParts] = await Promise.all([
    Storage.load('cars', []),
    Storage.load('parts', [])
  ]);

  const migrated = Migrations.run(rawCars, rawParts);
  Store.cars = migrated.cars;
  Store.parts = migrated.parts;

  // Записываем нормализованные данные после миграции, чтобы старый формат
  // не мигрировал заново при каждом запуске приложения.
  await Promise.all([
    Storage.persist('cars', migrated.cars),
    Storage.persist('parts', migrated.parts)
  ]);

  Router.switchTab('cars');
})();
</script>
</body>
</html>
